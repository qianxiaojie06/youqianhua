<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Garden 🌙</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Microsoft JhengHei", -apple-system, sans-serif;
    background: linear-gradient(180deg, #070b14 0%, #111827 100%);
    min-height: 100vh;
    overflow: hidden; 
    color: white;
}

/* 静态星空背景 */
.stars {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
}

.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    animation: twinkle 3s infinite;
    box-shadow: 0 0 4px rgba(255, 255, 255, 0.8);
}

/* 渐变光晕 */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 20%, rgba(216, 183, 179, 0.08), transparent 50%);
    pointer-events: none;
    z-index: 0;
}

@keyframes twinkle {
    0% { opacity: .1; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.2); }
    100% { opacity: .1; transform: scale(0.8); }
}

/* 流星雨容器 */
#shooting-stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    transform: rotate(-45deg); /* 让流星倾斜划过 */
}

.shooting-star {
    position: absolute;
    height: 1px;
    background: linear-gradient(90deg, rgba(255,255,255,1), transparent);
    animation: shooting 5s linear infinite;
    opacity: 0;
    border-radius: 999px;
    box-shadow: 0 0 10px rgba(255,255,255,0.4);
}

@keyframes shooting {
    0% { transform: translateX(0); opacity: 1; width: 0; }
    10% { width: 100px; }
    20% { transform: translateX(-500px); opacity: 0; width: 0; }
    100% { transform: translateX(-500px); opacity: 0; width: 0; }
}

/* 满天飞舞的留言容器 */
#sky-messages {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
}

/* 主容器 */
.layout {
    display: flex;
    justify-content: flex-start;
    align-items: center;
    width: 100%;
    height: 100vh;
    padding: 0 10%;
    position: relative;
    z-index: 2;
}

/* 左侧面板 */
.left-panel {
    max-width: 600px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.title {
    font-size: 3.5rem;
    font-family: "Noto Serif SC", serif;
    font-weight: 300;
    margin-bottom: 15px;
    text-shadow: 0 0 20px rgba(255,255,255,0.2);
}

.moon-line {
    font-size: 14px;
    letter-spacing: 15px;
    opacity: .4;
    margin-bottom: 30px;
}

/* 竖排诗意文本 */
.poem {
    writing-mode: vertical-lr;
    text-orientation: mixed;
    font-family: "Noto Serif SC", serif;
    font-weight: 300;
    font-size: 1.15rem;
    letter-spacing: 6px;
    line-height: 2.5;
    color: rgba(255, 255, 255, 0.85);
    height: 180px; /* 控制竖排的高度 */
    margin-bottom: 40px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
}

/* 黑胶部分 */
.vinyl-section {
    position: relative;
    width: 100%;
    height: 240px;
    margin: 0 auto 30px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.vinyl {
    width: 240px;
    height: 240px;
    cursor: pointer;
    border-radius: 50%;
    box-shadow: 0 0 50px rgba(0,0,0,0.6), 0 0 20px rgba(255,255,255,0.1);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.vinyl:hover {
    transform: scale(1.02);
    box-shadow: 0 0 60px rgba(0,0,0,0.8), 0 0 30px rgba(255,255,255,0.2);
}

.playing {
    animation: spin 5s linear infinite;
}

@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* 播放列表框与输入框通用玻璃拟态 */
.glass-box {
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 24px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
}

.song-box {
    padding: 20px 30px;
    margin-bottom: 25px;
}

.song-box h2 {
    font-size: 1.1rem;
    margin-bottom: 8px;
    font-family: "Noto Serif SC", serif;
    font-weight: 400;
}

.song-box p {
    font-size: 0.9rem;
    opacity: 0.6;
}

/* 悬浮返回按钮样式 */
.floating-back-btn {
    position: fixed;
    top: 30px;
    left: 40px;
    padding: 10px 24px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 30px;
    color: rgba(255, 255, 255, 0.8);
    text-decoration: none;
    font-size: 0.95rem;
    letter-spacing: 2px;
    z-index: 100;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    font-family: "Noto Serif SC", serif;
}

.floating-back-btn:hover {
    color: white;
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(216, 183, 179, 0.5);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(216, 183, 179, 0.2);
}

/* 适配手机端，稍微调整位置 */
@media(max-width: 800px) {
    .floating-back-btn {
        top: 20px;
        left: 20px;
        padding: 8px 16px;
        font-size: 0.85rem;
    }
}

/* 右侧：留言面板 */
.right-panel {
    position: fixed;
    bottom: 40px;
    right: 40px;
    width: 360px;
    z-index: 10;
}

.counter {
    margin-bottom: 12px;
    font-size: 0.95rem;
    opacity: .7;
    text-align: right;
    padding-right: 15px;
    letter-spacing: 1px;
}

.message-box {
    padding: 30px;
}

.message-box h2 {
    margin-bottom: 20px;
    font-size: 1.2rem;
    font-family: "Noto Serif SC", serif;
    font-weight: 400;
}

input, textarea {
    width: 100%;
    padding: 15px;
    background: rgba(0, 0, 0, 0.2);
    color: white;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    outline: none;
    margin-bottom: 15px;
    font-family: inherit;
    transition: border-color 0.3s, background 0.3s;
}

input:focus, textarea:focus {
    border-color: rgba(216, 183, 179, 0.5);
    background: rgba(0, 0, 0, 0.3);
}

input::placeholder, textarea::placeholder {
    color: rgba(255,255,255,.3);
}

textarea {
    height: 110px;
    resize: none;
    line-height: 1.5;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, #D8B7B3 0%, #c49f9a 100%);
    color: white;
    cursor: pointer;
    font-weight: bold;
    font-size: 1rem;
    letter-spacing: 2px;
    box-shadow: 0 4px 15px rgba(216, 183, 179, 0.2);
    transition: transform 0.2s, box-shadow 0.2s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(216, 183, 179, 0.4);
}

/* 向上飘动的留言气泡 */
.floating-note {
    position: absolute;
    bottom: -100px;
    padding: 12px 24px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 999px;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.9);
    white-space: nowrap;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    animation: floatUp linear infinite;
    letter-spacing: 1px;
}

@keyframes floatUp {
    0% { transform: translateY(0) scale(0.8); opacity: 0; }
    5% { opacity: 1; transform: translateY(-5vh) scale(1); }
    90% { opacity: 1; }
    100% { transform: translateY(-110vh) scale(1); opacity: 0; }
}

@media(max-width: 800px) {
    .layout {
        flex-direction: column;
        justify-content: center;
        padding: 40px 20px;
        height: auto;
        min-height: 100vh;
    }
    .poem {
        height: 140px;
        font-size: 1rem;
    }
    .right-panel {
        position: relative;
        bottom: 0;
        right: 0;
        width: 100%;
        max-width: 600px;
        margin-top: 50px;
    }
    .counter {
        text-align: left;
        padding-left: 10px;
    }
}
</style>
</head>

<body>

<div class="stars" id="stars"></div>
<div id="shooting-stars"></div>
<div id="sky-messages"></div>

<div class="layout">
    <div class="left-panel">
        <h1 class="title">Secret Garden</h1>
        <div class="moon-line">✦ ✧ ✦</div>
        
        <div class="poem">
            欢迎来到有钱花的秘密花园<br>
            藏着一些没说出口的话<br>
            和只想给你听的声音
        </div>

        <div class="vinyl-section">
            <img src="vinyl.png" class="vinyl" id="vinyl" onclick="toggleMusic()" alt="Vinyl Player">
        </div>

        <div class="song-box glass-box">
            <h2>🎵 Secret Playlist</h2>
            <p>点击黑胶 · 聆听秘密花园的声音</p>
        </div>
        
        <a href="index.html" class="floating-back-btn">← 离开花园</a>
    </div>

    <div class="right-panel">
        <div class="counter">
            ❀ 共落下了 <span id="count">0</span> 瓣心事
        </div>

        <div class="message-box glass-box">
            <h2>✍️ 留白</h2>
            <input id="name" placeholder="署名 (可匿名)">
            <textarea id="message" placeholder="写下那些没说出口的话... (Enter 发送)"></textarea>
            <button onclick="sendMessage()">悄悄送出</button>
        </div>
    </div>
</div>

<audio id="music">
    <source src="yintian.mp3" type="audio/mpeg">
</audio>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://lncrvsgyndxiusctukwp.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxuY3J2c2d5bmR4aXVzY3R1a3dwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2NjY5NzEsImV4cCI6MjA5NjI0Mjk3MX0.NdIPk3gzkzXdmmtnk6GIgknhhCoNtk7CGnpp1Csxx-8";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* 生成静态星空 */
const stars = document.getElementById("stars");
for(let i=0; i<150; i++){
    const star = document.createElement("div");
    star.classList.add("star");
    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.animationDelay = Math.random() * 4 + "s";
    star.style.opacity = Math.random();
    stars.appendChild(star);
}

/* 生成流星雨 */
const shootingStars = document.getElementById("shooting-stars");
for(let i=0; i<8; i++){
    const star = document.createElement("div");
    star.classList.add("shooting-star");
    // 随机分布在屏幕上半部分，给一个从右上角划下的错觉
    star.style.top = Math.random() * 100 + "vh";
    star.style.left = Math.random() * 100 + "vw";
    star.style.animationDelay = Math.random() * 10 + "s";
    star.style.animationDuration = (3 + Math.random() * 4) + "s";
    shootingStars.appendChild(star);
}

/* 音乐控制 */
const music = document.getElementById("music");
const vinyl = document.getElementById("vinyl");

function toggleMusic(){
    if(music.paused){
        music.play();
        vinyl.classList.add("playing");
    }else{
        music.pause();
        vinyl.classList.remove("playing");
    }
}

/* 监听 Enter 键发送留言 */
document.getElementById('message').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

/* 发送留言 */
async function sendMessage(){
    const name = document.getElementById("name").value.trim();
    const message = document.getElementById("message").value.trim();

    if(!message){
        alert("写点什么再走吧 ❀");
        return;
    }

    // 将按钮文字改为发送中状态
    const btn = document.querySelector('button');
    const originalText = btn.innerText;
    btn.innerText = "投递中...";
    btn.disabled = true;

    const {error} = await supabaseClient
        .from("messages")
        .insert([{
            name: name || "匿名",
            message: message
        }]);

    btn.innerText = originalText;
    btn.disabled = false;

    if(error){
        console.error(error);
        alert("风太大，信件丢失了，请稍后再试");
        return;
    }

    document.getElementById("message").value = "";
    loadMessages();
}

/* 加载留言并生成气泡 */
async function loadMessages(){
    const sky = document.getElementById("sky-messages");
    sky.innerHTML = "";

    const {data, error} = await supabaseClient
        .from("messages")
        .select("*")
        .order("created_at", {ascending: false});

    if(error){
        console.error(error);
        return;
    }

    document.getElementById("count").innerText = data.length;

    data.forEach(item => {
        const note = document.createElement("div");
        note.className = "floating-note";
        
        const displayName = item.name === "匿名" ? "" : `${item.name}: `;
        note.innerHTML = `✨ ${displayName}${item.message}`;

        note.style.left = (10 + Math.random() * 75) + "%";

        const duration = 18 + Math.random() * 25; 
        const delay = -(Math.random() * 30); 

        note.style.animationDuration = duration + "s";
        note.style.animationDelay = delay + "s";

        sky.appendChild(note);
    });
}

loadMessages();
</script>

</body>
</html>
